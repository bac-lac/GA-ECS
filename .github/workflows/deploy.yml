name: Deploy
description: Deploy GoAnywhere to AWS

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: "Name of the environment to deploy"
        options:
        - pr
        - dev
        - pre-prod
        - prod

env:
  AWS_REGION: ca-central-1
  IMAGE_REPO_TAG: bac-lac-gc-ca/mft:latest
  ENV: ${{ inputs.environment || 'pr' }}

permissions:
      id-token: write
      contents: read
      actions: write

jobs:
  Code-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkov security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          output_format: cli

  Deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success')
    needs: Code-check
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'pr' }}
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_DEVOPS_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true
          audience: sts.amazonaws.com

      - name: echo test
        run: echo "Deploying to ${{ env.ENV }}"

      - name: Get latest version immutable image URI
        run: |
          REPO=bac-lac-gc-ca/mft
          REGISTRY=$(aws ecr describe-repositories --repository-names "$REPO" --query 'repositories[0].repositoryUri' --output text)
          VERSION_TAG=$(aws ecr describe-images --repository-name "$REPO" --image-ids imageTag=latest --query 'imageDetails[0].imageTags' --output json | jq -r '.[] | select(. != "latest")')
          IMAGE_URI="${REGISTRY}:${VERSION_TAG}"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
      
      - name: Create tfvars file
        uses: ./.github/actions/create-tfvars-file
        with:
          secrets: ${{ toJSON(secrets) }}
          vars: ${{ toJSON(vars) }}
            
      - name: Add Dynamic Variables to tfvars
        run: |
          echo "ECR_IMAGE = \"$IMAGE_URI\"" >> pipeline.auto.tfvars

      - name: Terraform-Setup
        id: Setup
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: true

      - name: Terraform-Init
        id: Init
        run: terraform init -backend-config="key=${{ env.ENV }}/ga/terraform.tfstate"

      - name: Terraform-Apply
        id: Apply
        run: terraform apply -var-file="pipeline.auto.tfvars" -var="ENV=${{ env.ENV }}" -var="CERT_BODY=${{ secrets.CERT_BODY }}" -var="CERT_CHAIN=${{ secrets.CERT_CHAIN }}" -var="CERT_PRIVATE_KEY=${{ secrets.CERT_PRIVATE_KEY }}" -auto-approve
